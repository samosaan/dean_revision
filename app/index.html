<title>L'expédition de Dean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap">
<style>
:root{
  --ground:#EDF2EE; --surface:#FFFFFF; --surface-2:#F5F8F6; --ink:#16302A; --muted:#566B63; --line:#D3DFD8;
  --pine:#1D6A53; --pine-ink:#FFFFFF; --pine-soft:#DCEDE5;
  --ocre:#C97A16; --ocre-soft:#FBEBD2; --grotte:#B3412B; --grotte-soft:#F8DED7;
  --ok:#2E8B4E; --ok-soft:#DDF1E3; --bad:#C0392B; --bad-soft:#FADCD8;
  --s-maths:#D8402F; --s-anglais:#D9A70F; --s-hg:#1B9BCB; --s-svt:#3A9B48; --s-francais:#6FAFBE; --s-pc:#E26C24; --s-aaa:#8E9995;
  --shadow:0 1px 2px rgba(22,48,42,.06),0 4px 14px rgba(22,48,42,.06);
  --display:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,-apple-system,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0E1613; --surface:#16211D; --surface-2:#1B2823; --ink:#E4EEE9; --muted:#9BB0A7; --line:#2A3B34;
    --pine:#4DB791; --pine-ink:#0B1A15; --pine-soft:#1C3A30;
    --ocre:#F0A94A; --ocre-soft:#3A2B14; --grotte:#E77A62; --grotte-soft:#3D2019;
    --ok:#5CC57E; --ok-soft:#18352A; --bad:#EF7A6C; --bad-soft:#3D1D1A;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0E1613; --surface:#16211D; --surface-2:#1B2823; --ink:#E4EEE9; --muted:#9BB0A7; --line:#2A3B34;
  --pine:#4DB791; --pine-ink:#0B1A15; --pine-soft:#1C3A30;
  --ocre:#F0A94A; --ocre-soft:#3A2B14; --grotte:#E77A62; --grotte-soft:#3D2019;
  --ok:#5CC57E; --ok-soft:#18352A; --bad:#EF7A6C; --bad-soft:#3D1D1A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:18px 60px;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.15}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--ocre);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* Header */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.top h1{font-size:clamp(1.6rem,4.5vw,2.3rem);font-weight:700;color:var(--pine)}
.top .sub{color:var(--muted);font-weight:600;margin-top:2px}
.purse{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:999px;padding:6px 16px 6px 8px;box-shadow:var(--shadow)}
.coin{width:34px;height:34px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFE3A3,var(--ocre) 70%);display:grid;place-items:center;font-family:var(--display);font-weight:700;color:#5A3200;font-size:.95rem;flex:none}
.purse b{font-family:var(--display);font-size:1.5rem;color:var(--ocre)}
.purse small{display:block;color:var(--muted);font-weight:700;font-size:.75rem;line-height:1}

/* Trail */
.trail-box{background:var(--surface);border-radius:20px;padding:14px 10px 10px;box-shadow:var(--shadow)}
.trail-scroll{overflow-x:auto;padding-bottom:6px}
.trail{display:flex;align-items:flex-start;min-width:max-content;position:relative;padding-inline:6px}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;width:66px;background:none;border:0;padding:4px 0;position:relative}
.stop::before{content:"";position:absolute;top:24px;left:-50%;width:100%;height:4px;background:repeating-linear-gradient(90deg,var(--line) 0 8px,transparent 8px 13px);z-index:0}
.stop:first-child::before{display:none}
.stop.walked::before{background:var(--ocre)}
.dot{width:42px;height:42px;border-radius:50%;border:3px solid var(--line);background:var(--surface);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1rem;position:relative;z-index:1;transition:transform .15s}
.stop:hover .dot{transform:scale(1.07)}
.stop.full .dot{background:var(--ocre);border-color:var(--ocre);color:#3F2300}
.stop.part .dot{border-color:var(--ocre);background:var(--ocre-soft)}
.stop.sel .dot{box-shadow:0 0 0 4px var(--pine)}
.stop.today .dot::after{content:"";position:absolute;inset:-9px;border-radius:50%;border:2px dashed var(--pine)}
.stop .dw{font-size:.72rem;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.stop .flag{position:absolute;top:-6px;right:6px;z-index:2;background:var(--grotte);color:#fff;font-size:.62rem;font-weight:800;border-radius:6px;padding:0 4px;letter-spacing:.03em}
.trail-legend{display:flex;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:.8rem;font-weight:600;padding:4px 8px 0}
.trail-legend i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}

/* Tabs */
.tabs{display:flex;gap:6px;background:var(--surface);padding:6px;border-radius:16px;box-shadow:var(--shadow);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.tab{flex:1;border:0;background:none;border-radius:11px;padding:10px 6px;font-family:var(--display);font-weight:600;font-size:1rem;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--pine);color:var(--pine-ink)}

.panel{display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:.8rem;font-weight:800;background:var(--surface-2);color:var(--ink)}
.sdot{width:10px;height:10px;border-radius:50%;display:inline-block;flex:none}

/* Day view */
.day-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.day-head h2{font-size:1.5rem}
.day-meta{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.progress{height:12px;border-radius:999px;background:var(--surface-2);overflow:hidden;margin-top:14px}
.progress>span{display:block;height:100%;background:var(--ocre);border-radius:999px;transition:width .4s}
.tasks{list-style:none;margin:14px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:var(--surface-2);border-radius:14px;padding:10px 12px;border-left:5px solid var(--c,var(--line))}
.task.done{opacity:.72}
.task.done .t-txt{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:var(--ocre)}
.check{width:30px;height:30px;border-radius:9px;border:2.5px solid var(--muted);background:var(--surface);flex:none;display:grid;place-items:center;padding:0}
.task.done .check{background:var(--ocre);border-color:var(--ocre)}
.check svg{width:18px;height:18px;opacity:0}
.task.done .check svg{opacity:1}
.t-txt{flex:1;font-weight:600}
.t-sub{display:block;font-weight:600;color:var(--muted);font-size:.85rem}
.t-coins{font-family:var(--display);font-weight:600;color:var(--ocre);font-size:.9rem;white-space:nowrap}
.go{border:0;background:var(--pine);color:var(--pine-ink);border-radius:10px;padding:6px 12px;font-weight:800;font-size:.85rem;white-space:nowrap}
.note{margin-top:12px;background:var(--pine-soft);border-radius:12px;padding:10px 14px;font-weight:600}
.exams{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.exam{border-radius:14px;padding:12px 14px;background:var(--surface-2);border-top:5px solid var(--c)}
.exam .when{font-family:var(--display);font-weight:600;font-size:1.05rem}
.exam .left{float:right;font-family:var(--display);font-weight:700;color:var(--grotte)}
.exam.past{opacity:.5}

/* Défis */
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px}
.dcard{text-align:left;border:0;background:var(--surface);border-radius:18px;padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;border-top:6px solid var(--c)}
.dcard:hover{transform:translateY(-2px)}
.dcard h3{font-size:1.15rem}
.dcard .best{display:flex;justify-content:space-between;align-items:center;font-weight:700;color:var(--muted);font-size:.85rem;margin-top:auto}
.stars{color:var(--ocre);letter-spacing:2px;font-size:1rem}

/* Quiz */
.quiz{background:var(--surface);border-radius:22px;padding:20px;box-shadow:var(--shadow);border-top:8px solid var(--c)}
.qtop{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.qbar{display:flex;gap:4px;margin:12px 0 18px}
.qbar i{flex:1;height:8px;border-radius:4px;background:var(--surface-2)}
.qbar i.ok{background:var(--ok)} .qbar i.ko{background:var(--bad)} .qbar i.cur{background:var(--ocre)}
.qprompt{font-family:var(--display);font-weight:600;font-size:clamp(1.2rem,3.6vw,1.6rem);margin-bottom:16px}
.qprompt .big{display:block;font-size:clamp(1.6rem,6vw,2.4rem);margin-top:6px;color:var(--pine)}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:10px}
.opt{border:2.5px solid var(--line);background:var(--surface-2);border-radius:14px;padding:14px;font-weight:700;text-align:left;font-size:1rem}
.opt.sym{text-align:center;font-family:var(--display);font-size:2rem;padding:8px}
.opt:hover:not(:disabled){border-color:var(--pine)}
.opt.good{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.pool{display:flex;gap:10px;flex-wrap:wrap}
.pill{border:2.5px solid var(--line);background:var(--surface-2);border-radius:12px;padding:10px 14px;font-family:var(--display);font-size:1.2rem;font-weight:600}
.pill:disabled{opacity:.3}
.slots{display:flex;gap:8px;flex-wrap:wrap;min-height:54px;padding:8px;border:2.5px dashed var(--line);border-radius:14px;margin-bottom:12px;align-items:center}
.slots .pill{background:var(--ocre-soft);border-color:var(--ocre)}
.sep{font-family:var(--display);font-size:1.4rem;color:var(--muted)}
.divbox{display:grid;grid-template-columns:auto auto;gap:0;font-family:var(--display);font-size:2rem;font-weight:600;width:max-content;margin-bottom:14px}
.divbox .dd{padding:4px 14px 4px 4px;border-right:3px solid var(--ink);color:var(--s-maths)}
.divbox .dv{padding:4px 4px 4px 14px;border-bottom:3px solid var(--ink);color:var(--s-svt)}
.divbox .q{grid-column:2;padding:4px 14px}
.fields{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end}
.fields label{display:flex;flex-direction:column;font-weight:800;font-size:.85rem;color:var(--muted);gap:4px}
.fields input{width:120px;font-family:var(--display);font-size:1.5rem;padding:8px 10px;border-radius:12px;border:2.5px solid var(--line);background:var(--surface-2);color:var(--ink)}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:800;background:var(--pine);color:var(--pine-ink)}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.warn{background:var(--grotte);color:#fff}
.feedback{margin-top:16px;border-radius:14px;padding:12px 14px;font-weight:700}
.feedback.ok{background:var(--ok-soft)} .feedback.ko{background:var(--bad-soft)}
.qactions{display:flex;justify-content:flex-end;margin-top:14px;gap:8px}
.result{text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center;padding:10px 0}
.result .score{font-family:var(--display);font-size:3rem;font-weight:700;color:var(--pine)}

/* Mémo */
details.memo{background:var(--surface);border-radius:18px;box-shadow:var(--shadow);border-left:6px solid var(--c)}
details.memo summary{list-style:none;padding:16px 18px;font-family:var(--display);font-weight:600;font-size:1.15rem;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
details.memo summary::-webkit-details-marker{display:none}
details.memo summary::after{content:"+";font-size:1.5rem;color:var(--muted)}
details.memo[open] summary::after{content:"–"}
.memo-body{padding:0 18px 18px;display:flex;flex-direction:column;gap:10px}
.memo-body dl{display:grid;grid-template-columns:minmax(110px,max-content) 1fr;gap:6px 14px;margin:0}
.memo-body dt{font-weight:800}
.memo-body dd{margin:0}
.memo-body pre{background:var(--surface-2);border-radius:12px;padding:12px;overflow-x:auto;font-size:.9rem;margin:0}
.big-letters{display:flex;gap:6px;flex-wrap:wrap}
.big-letters span{font-family:var(--display);font-weight:700;background:var(--pine-soft);border-radius:10px;padding:4px 10px;text-align:center;line-height:1.1}
.big-letters small{display:block;font-family:var(--body);font-size:.7rem;font-weight:700;color:var(--muted)}

/* Papa */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:14px;padding:12px 14px}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;color:var(--pine)}
table{border-collapse:collapse;width:100%}
.tscroll{overflow-x:auto}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);font-size:.92rem}
th{color:var(--muted);font-size:.78rem;text-transform:uppercase;letter-spacing:.05em}
.bars{display:flex;gap:3px;align-items:flex-end;height:26px}
.bars i{width:8px;border-radius:2px;background:var(--pine);display:block}
.weak{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.weak li{background:var(--surface-2);border-radius:10px;padding:8px 12px;display:flex;gap:10px;justify-content:space-between}
.log{list-style:none;margin:0;padding:0;font-size:.9rem;display:flex;flex-direction:column;gap:4px}
.log li{display:flex;gap:10px}
.log time{color:var(--muted);min-width:110px}
.sync{font-size:.8rem;color:var(--muted);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--ground);padding:10px 18px;border-radius:999px;font-weight:800;z-index:20;box-shadow:var(--shadow)}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.tab{white-space:nowrap}
@media (max-width:520px){.tab{font-size:.88rem;padding-inline:2px}.task{flex-wrap:wrap}.t-txt{min-width:60%}}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1>L'expédition de Dean</h1>
      <div class="sub">Vacances d'automne · objectif : rentrée sereine le mardi 6 octobre</div>
    </div>
    <div class="purse" aria-live="polite">
      <div class="coin" aria-hidden="true">D</div>
      <div><b class="num" id="coins">0</b><small id="rank">pièces</small></div>
    </div>
  </header>

  <section class="trail-box" aria-label="Le parcours jour par jour">
    <div class="trail-scroll"><div class="trail" id="trail"></div></div>
    <div class="trail-legend">
      <span><i style="background:var(--ocre)"></i>journée terminée</span>
      <span><i style="border:2px dashed var(--pine)"></i>aujourd'hui</span>
      <span><i style="background:var(--grotte)"></i>contrôle ce jour-là</span>
    </div>
  </section>

  <nav class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-jour" aria-selected="true" data-tab="jour">Ma journée</button>
    <button class="tab" role="tab" id="tab-defis" aria-selected="false" data-tab="defis">Défis</button>
    <button class="tab" role="tab" id="tab-memo" aria-selected="false" data-tab="memo">Mémo</button>
    <button class="tab" role="tab" id="tab-papa" aria-selected="false" data-tab="papa">Papa</button>
  </nav>

  <main id="view" class="panel"></main>
  <div class="sync" id="sync"></div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
/* ---------- Données ---------- */
const SUBJ = {
  maths:{n:"Mathématiques",c:"var(--s-maths)"}, anglais:{n:"Anglais",c:"var(--s-anglais)"},
  hg:{n:"Histoire-Géo",c:"var(--s-hg)"}, svt:{n:"SVT en anglais",c:"var(--s-svt)"},
  francais:{n:"Français",c:"var(--s-francais)"}, pc:{n:"Physique-chimie",c:"var(--s-pc)"},
  aaa:{n:"Apprendre à apprendre",c:"var(--s-aaa)"}
};
const EXAMS = [
  {d:"2026-10-06",s:"maths",t:"Mini-test sur 5 points : comparaison des nombres entiers"},
  {d:"2026-10-06",s:"anglais",t:"QCM sur le début du film (Kevin et sa famille)"},
  {d:"2026-10-06",s:"francais",t:"Rédaction en classe : l'aventure (dictionnaire)"},
  {d:"2026-10-06",s:"svt",t:"Révision : Living organisms"},
  {d:"2026-10-07",s:"hg",t:"Mini-évaluation : objets d'art, définitions, dates"},
  {d:"2026-10-09",s:"maths",t:"Mini-test : divisions euclidiennes"}
];
// t: texte, s: matière, p: pièces, defi: défi lié
const DAYS = [
 {d:"2026-09-27",dur:"1 h",title:"La Préhistoire",tasks:[
  {id:"d1a",s:"hg",t:"Lire la fiche : les objets d'art (art pariétal, statuettes, colliers)",p:5},
  {id:"d1b",s:"hg",t:"Apprendre 3 définitions : art pariétal, pigment, gravure",p:5},
  {id:"d1c",s:"hg",t:"Lire : Néolithique, domestication, les 2 dates",p:5},
  {id:"d1d",s:"hg",t:"Défi Histoire",sub:"Au moins 6 bonnes réponses sur 8",p:5,defi:"hg"}]},
 {d:"2026-09-28",dur:"1 h",title:"Comparer les nombres",tasks:[
  {id:"d2a",s:"maths",t:"Relire « Je me souviens » : le crocodile, croissant / décroissant",p:5},
  {id:"d2b",s:"maths",t:"Refaire « Je m'entraîne 1 » sur la fiche vierge",p:10},
  {id:"d2c",s:"maths",t:"Corriger avec le corrigé de la prof",p:5},
  {id:"d2d",s:"maths",t:"Défi Comparaison",p:5,defi:"cmp"}]},
 {d:"2026-09-29",dur:"1 h",title:"Home Alone",tasks:[
  {id:"d3a",s:"anglais",t:"Regarder le début du film (en anglais, sous-titres autorisés)",p:10},

  {id:"d3c",s:"anglais",t:"Défi Anglais",p:5,defi:"ang"},
  {id:"d3d",s:"hg",t:"Rappel express : Défi Histoire (10 min)",p:5,defi:"hg"}]},
 {d:"2026-09-30",dur:"1 h",title:"Préparer l'aventure",tasks:[
  {id:"d4a",s:"francais",t:"Lister 5 idées d'histoires d'aventure",p:5},
  {id:"d4b",s:"francais",t:"Noter 10 mots utiles (lieux, émotions, actions)",p:5},
  {id:"d4c",s:"francais",t:"Faire un plan au brouillon : début, péripéties, fin",p:10},
  {id:"d4d",s:"maths",t:"Rappel express : Défi Comparaison (10 min)",p:5,defi:"cmp"}]},
 {d:"2026-10-01",dur:"45 min",title:"Matériel et rappels",tasks:[
  {id:"d5a",s:"pc",t:"Vérifier le matériel de Physique-chimie : cahier, trousse, feuilles",p:5},
  {id:"d5b",s:"aaa",t:"Coller le quiz et la feuille des 10 commandements",p:5},
  {id:"d5c",s:"anglais",t:"Rappel express : Défi Anglais",p:5,defi:"ang"}]},
 {d:"2026-10-02",dur:"45 min",title:"Living organisms",tasks:[
  {id:"d6a",s:"svt",t:"Relire le cours et le lexique",p:5},
  {id:"d6b",s:"svt",t:"Apprendre MRS GREN (les 7 caractéristiques)",p:5},
  {id:"d6c",s:"svt",t:"Cellule animale et cellule végétale : les différences",p:5},
  {id:"d6d",s:"svt",t:"Défi SVT",p:5,defi:"svt"}]},
 {d:"2026-10-03",dur:"1 h",title:"Divisions 1/2",tasks:[
  {id:"d7a",s:"maths",t:"Apprendre : dividende, diviseur, quotient, reste",p:5},
  {id:"d7b",s:"maths",t:"Dessiner le schéma 158 ÷ 12 de mémoire",p:5},
  {id:"d7c",s:"maths",t:"Refaire l'exemple guidé 884 ÷ 34",p:5},
  {id:"d7d",s:"maths",t:"« Je m'entraîne 1 », exercice 1 (divisions guidées)",p:10},

const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(0,i);[a[i],a[j]]=[a[j],a[i]]}return a};
const fmt=n=>String(n).replace(/\B(?=(\d{3})+(?!\d))/g," ");
const choice=(key,prompt,right,wrongs,explain,extra)=>({type:"choice",key,prompt,options:shuffle([right,...wrongs]),answer:right,explain,...(extra||{})});

function genCmp(){
  const qs=[];
  for(let i=0;i<5;i++){
    const len=rnd(4,7); let a=rnd(10**(len-1),10**len-1); let b;
    const mode=rnd(0,9);
    if(mode<6){ // même longueur, un chiffre change
      const s=String(a).split(""); const pos=rnd(1,len-1); let d; do{d=rnd(0,9)}while(d===+s[pos]); s[pos]=d; b=+s.join("");
    } else if(mode<8){ // échange de deux chiffres voisins
      const s=String(a).split(""); const pos=rnd(1,len-2); [s[pos],s[pos+1]]=[s[pos+1],s[pos]]; b=+s.join(""); if(b===a){b=a+rnd(1,9)}
    } else if(mode<9){ b=+String(a).slice(1); } else { b=a; }
    if(Math.random()<.5)[a,b]=[b,a];
    const ans=a<b?"<":a>b?">":"=";
    qs.push({type:"choice",sym:true,key:"cmp",prompt:`Complète par <, > ou =`,big:`${fmt(a)}  …  ${fmt(b)}`,options:["<","=",">"],answer:ans,
      explain: a===b?"Les deux nombres sont identiques.": String(a).length!==String(b).length?"Le nombre qui a le plus de chiffres est le plus grand.":"Même nombre de chiffres : on compare de gauche à droite jusqu'au premier chiffre différent."});
  }
  for(let i=0;i<3;i++){
    const len=rnd(3,7); const base=String(rnd(10**(len-1),10**len-1)).split("");
    const set=new Set([+base.join("")]);
    let guard=0; while(set.size<4&&guard++<200){const s=base.slice();const p=rnd(1,len-1),q=rnd(0,len-1);if(q>0||s[p]!=="0"){[s[p],s[q]]=[s[q],s[p]]} if(s[0]!=="0")set.add(+s.join(""))}
    while(set.size<4)set.add(rnd(10**(len-1),10**len-1));
    const nums=[...set]; const up=Math.random()<.5;
    qs.push({type:"order",key:"order",prompt:`Range dans l'ordre ${up?"croissant (du plus petit au plus grand)":"décroissant (du plus grand au plus petit)"}`,
      items:shuffle(nums),correct:nums.slice().sort((x,y)=>up?x-y:y-x),sep:up?"<":">",explain:up?"Croissant : on commence par le plus petit.":"Décroissant : on commence par le plus grand."});
  }
  return shuffle(qs);
}
function genDiv(){
  const qs=[];
  const pairs=[[rnd(100,999),rnd(3,9)],[rnd(100,999),rnd(11,19)],[rnd(1000,9999),rnd(3,9)],[rnd(1000,9999),rnd(12,40)],[rnd(200,999),rnd(21,45)]];
  pairs.forEach(([a,b])=>qs.push({type:"div",key:"div-calc",a,b,prompt:`Pose la division euclidienne de ${fmt(a)} par ${b}`}));
  const b=rnd(6,25),q=rnd(8,60),r=rnd(0,b-1),a=b*q+r;
  const role=["dividende","diviseur","quotient","reste"][rnd(0,3)];
  const val={dividende:a,diviseur:b,quotient:q,reste:r}[role];
  const opts=[...new Set([a,b,q,r].map(String))];
  qs.push({type:"choice",key:"div-role",prompt:`Dans ${fmt(a)} = ${b} × ${q} + ${r}, quel est le ${role} ?`,options:shuffle(opts),answer:String(val),explain:`dividende = diviseur × quotient + reste : ${fmt(a)} = ${b} × ${q} + ${r}.`});
  const bb=rnd(5,12),qq=rnd(5,15),bad=bb+rnd(1,4),aa=bb*qq+bad;
  qs.push(choice("div-rule",`« ${aa} = ${bb} × ${qq} + ${bad} » : est-ce la division euclidienne de ${aa} par ${bb} ?`,"Non, le reste est trop grand",["Oui, c'est juste","Non, il manque le quotient"],`Le reste doit être plus petit que le diviseur (${bad} n'est pas < ${bb}). La bonne réponse : ${aa} = ${bb} × ${qq+1} + ${bad-bb}.`));
  qs.push(choice("div-fleur","La fleuriste a 1 815 fleurs. Bouquets de 16 ou de 17 pour en utiliser le plus possible ?","Bouquets de 16",["Bouquets de 17","C'est pareil"],"1 815 = 16 × 113 + 7 (il reste 7 fleurs) et 1 815 = 17 × 106 + 13 (il en reste 13). Avec 16, il reste moins de fleurs."));
  return qs;
}

    ()=>choice("svt-resp","Where does most respiration happen?","In the mitochondria",["In the chloroplasts","In the cell wall","In the nucleus"],"Mitochondria are the cell's energy factories."),

      <span class="t-txt">${esc(t.t)}${t.sub?`<span class="t-sub">${esc(t.sub)}</span>`:""}</span>
      ${t.defi?`<button class="go" data-defi="${t.defi}" data-from="${t.id}">Jouer</button>`:""}
      <span class="t-coins num">+${t.p}</span></li>`).join("")}</ul>
  </section>
  <section class="card"><h3 style="margin-bottom:12px">Les contrôles de la rentrée</h3>
    <div class="exams">${EXAMS.map(e=>{const days=Math.round((pd(e.d)-pd(TODAY))/864e5);return `<div class="exam ${days<0?"past":""}" style="--c:${SUBJ[e.s].c}">
      <span class="left num">${days>1?"J−"+days:days===1?"demain":days===0?"aujourd'hui":"passé"}</span>
      <div class="when">${longDate(e.d)}</div><div style="font-weight:800">${SUBJ[e.s].n}</div><div class="muted">${esc(e.t)}</div></div>`}).join("")}</div>
  </section>`;
}
function stars(best,total){const r=total?best/total:0;const n=r>=1?3:r>=.75?2:r>=.5?1:0;return "★".repeat(n)+"☆".repeat(3-n)}
function viewDefis(){
  return `<section class="card"><h2 style="font-size:1.4rem">Défis</h2><p class="muted" style="margin:6px 0 0">Chaque défi change à chaque partie. 2 pièces par bonne réponse, 5 de bonus pour un sans-faute. 3 étoiles = prêt pour le contrôle.</p></section>
  <div class="grid">${Object.entries(DEFIS).map(([k,d])=>{const q=state.quiz[k]||{};return `<button class="dcard" data-defi="${k}" style="--c:${SUBJ[d.s].c}">
    <span class="chip" style="align-self:flex-start"><span class="sdot" style="background:${SUBJ[d.s].c}"></span>${d.for}</span>
    <h3>${d.n}</h3><span class="muted">${d.d}</span>
    <span class="best"><span class="stars">${stars(q.best||0,q.total||8)}</span><span>${q.runs?`record ${q.best}/${q.total} · ${q.runs} partie${q.runs>1?"s":""}`:"pas encore joué"}</span></span></button>`}).join("")}</div>`;
}

    <p><b>Le crocodile</b> ouvre la bouche vers le plus grand : <b>12 &gt; 0</b> (est plus grand que), <b>35 &lt; 53</b> (est plus petit que).</p>
    <p><b>&lt;</b> pour l'ordre <b>c</b>roissant, <b>&gt;</b> pour l'ordre <b>d</b>écroissant.</p>

    <p class="muted">Exemples de la prof : 6 502 &lt; 16 502 · 800 &gt; 760 &gt; 759 &gt; 706</p></div></details>
  <details class="memo" style="--c:var(--s-maths)"><summary>Maths · La division euclidienne</summary><div class="memo-body">
    <p><b>dividende = diviseur × quotient + reste</b>, avec <b>reste &lt; diviseur</b></p>
<pre>  Dividende →  1 5 8 │ 1 2  ← Diviseur
              -1 2   │────
               ───   │ 1 3  ← Quotient
                 3 8
               - 3 6
                 ───
  Reste    →       2       158 = 12 × 13 + 2</pre>
    <p class="muted">Exemple guidé : 884 ÷ 34 → 34 va 2 fois dans 88 (68, reste 20), on abaisse le 4 : 204, 34 va 6 fois (204, reste 0). 884 = 34 × 26 + 0.</p></div></details>
  <details class="memo" style="--c:var(--s-hg)"><summary>Histoire · Préhistoire et Néolithique</summary><div class="memo-body">
    <dl><dt>Art pariétal</dt><dd>Peintures ou gravures réalisées sur les parois (les murs) d'une grotte.</dd>
    <dt>Pigment</dt><dd>Matière colorée naturelle (ocre, charbon) utilisée pour peindre.</dd>

    <dt>Néolithique</dt><dd>Dernière période de la Préhistoire, marquée par le début de l'agriculture et de l'élevage.</dd>

    <p><b>Vers − 10 000 ans</b> : débuts de l'agriculture et de l'élevage au <b>Proche-Orient</b>.<br><b>Vers − 6 000 ans</b> : ils se répandent en <b>Europe</b>.</p>
    <p class="muted">Œuvres : peintures et gravures sur les parois, statuettes, colliers. Matériaux : pigments (ocre, charbon), ivoire, coquillages. Leur signification exacte reste inconnue.</p></div></details>
  <details class="memo" style="--c:var(--s-svt)"><summary>SVT · Living organisms</summary><div class="memo-body">
    <div class="big-letters">${MRS.map(([w])=>`<span>${w[0]}<small>${w}</small></span>`).join("")}</div>
    <p><b>Cell</b> : the smallest unit of life. <b>Animal cell</b> : nucleus, cytoplasm, cell membrane, mitochondria. <b>Plant cell</b> : the same <b>+ cell wall, vacuole, chloroplasts</b>.</p>
    <p class="muted">Photosynthesis → chloroplasts · Respiration → mitochondria · DNA → nucleus</p>
    <dl>${LEX.map(([e,f])=>`<dt>${e}</dt><dd>${f}</dd>`).join("")}</dl></div></details>
  <details class="memo" style="--c:var(--s-anglais)"><summary>Anglais · Home Alone et la famille</summary><div class="memo-body">
    <p>Kevin McCallister, 8 ans, est oublié à la maison quand sa famille part à Paris pour Noël.</p>
    <dl><dt>Mother / Father</dt><dd>Mère / Père (Kate et Peter)</dd><dt>Brother / Sister</dt><dd>Frère / Sœur (Buzz est son grand frère)</dd><dt>Uncle / Aunt</dt><dd>Oncle / Tante</dd><dt>Cousin</dt><dd>Cousin, cousine</dd><dt>Parents</dt><dd>Les parents</dd></dl>
    <p class="muted">Le QCM portera sur les scènes vues en classe : à compléter avec le cahier.</p></div></details>`;
}
function viewPapa(){
  const done=allTasks.filter(t=>state.done[t.id]).length;
  const passedDays=DAYS.filter(d=>d.d<TODAY);
  const late=passedDays.flatMap(d=>d.tasks.filter(t=>!state.done[t.id]).map(t=>({...t,day:d.d})));
  const weak={};
  Object.entries(state.quiz).forEach(([k,q])=>Object.entries(q.missed||{}).forEach(([key,m])=>{weak[key]={...m,defi:k}}));
  const weakList=Object.values(weak).sort((a,b)=>b.n-a.n).slice(0,8);
  return `<section class="card"><h2 style="font-size:1.4rem;margin-bottom:12px">Tableau de bord de papa</h2>
    <div class="stats">
      <div class="stat"><b class="num">${done}/${allTasks.length}</b>missions faites</div>
      <div class="stat"><b class="num">${coins()}</b>pièces gagnées</div>
      <div class="stat"><b class="num">${Object.values(state.quiz).reduce((a,q)=>a+(q.runs||0),0)}</b>défis joués</div>
      <div class="stat"><b class="num" style="color:${late.length?"var(--grotte)":"var(--ok)"}">${late.length}</b>missions en retard</div>
    </div></section>
  <section class="card"><h3 style="margin-bottom:10px">Prêt pour les contrôles ?</h3><div class="tscroll"><table>
    <thead><tr><th>Défi</th><th>Pour</th><th>Record</th><th>Parties</th><th>5 dernières</th></tr></thead><tbody>
    ${Object.entries(DEFIS).map(([k,d])=>{const q=state.quiz[k]||{};const h=(q.hist||[]).slice(-5);return `<tr><td><span class="sdot" style="background:${SUBJ[d.s].c}"></span> <b>${d.n}</b></td><td>${d.for}</td>
      <td class="num">${q.runs?`${q.best}/${q.total} <span class="stars">${stars(q.best,q.total)}</span>`:"–"}</td><td class="num">${q.runs||0}</td>
      <td><div class="bars">${h.map(r=>`<i title="${r}%" style="height:${Math.max(8,r)}%;background:${r>=75?"var(--ok)":r>=50?"var(--ocre)":"var(--bad)"}"></i>`).join("")}</div></td></tr>`}).join("")}
    </tbody></table></div></section>
  <section class="card"><h3 style="margin-bottom:10px">Points à retravailler</h3>
    ${weakList.length?`<ul class="weak">${weakList.map(w=>`<li><span>${esc(w.prompt)}<br><span class="muted">Bonne réponse : ${esc(w.answer)}</span></span><span class="chip">${w.n} erreur${w.n>1?"s":""}</span></li>`).join("")}</ul>`:`<p class="muted">Rien pour l'instant : les erreurs des défis apparaîtront ici.</p>`}</section>
  <section class="card"><h3 style="margin-bottom:10px">Missions en retard</h3>
    ${late.length?`<ul class="weak">${late.map(t=>`<li><span><span class="sdot" style="background:${SUBJ[t.s].c}"></span> ${esc(t.t)}</span><span class="muted">${longDate(t.day)}</span></li>`).join("")}</ul>`:`<p class="muted">Aucune, tout est à jour.</p>`}</section>
  <section class="card"><h3 style="margin-bottom:10px">Dernières activités</h3>
    ${state.log.length?`<ul class="log">${state.log.slice(0,15).map(l=>{const x=new Date(l.t);return `<li><time>${DAYNAMES[x.getDay()]} ${x.getDate()} · ${String(x.getHours()).padStart(2,"0")}h${String(x.getMinutes()).padStart(2,"0")}</time><span>${esc(l.label)}${l.p?` <b style="color:var(--ocre)">+${l.p}</b>`:""}</span></li>`}).join("")}</ul>`:`<p class="muted">Pas encore d'activité.</p>`}</section>
  <section class="card"><h3 style="margin-bottom:6px">Remettre à zéro</h3><p class="muted" style="margin:0 0 10px">Efface les missions cochées, les scores et les pièces, sur tous les appareils.</p>
    <div id="reset-zone"><button class="btn ghost" id="reset1">Tout remettre à zéro</button></div></section>`;
}

function bind(){
  document.querySelectorAll("[data-task]").forEach(b=>b.onclick=()=>{
    const id=b.dataset.task, t=allTasks.find(x=>x.id===id);
    if(state.done[id]){delete state.done[id];log("Décoché : "+t.t,0)} else {state.done[id]=Date.now();log(t.t,t.p);toast(`+${t.p} pièces !`)}
    persist(); render();
  });
  document.querySelectorAll("[data-defi]").forEach(b=>b.onclick=()=>startQuiz(b.dataset.defi,b.dataset.from));
  const r1=$("#reset1"); if(r1) r1.onclick=()=>{$("#reset-zone").innerHTML=`<span style="font-weight:700;margin-right:10px">Sûr ? Tout sera effacé.</span><button class="btn warn" id="reset2">Oui, effacer</button> <button class="btn ghost" id="reset0">Annuler</button>`;
    $("#reset2").onclick=()=>{state={done:{},quiz:{},log:[],updatedAt:0};persist();render();toast("Remis à zéro")};$("#reset0").onclick=render;};
}

/* ---------- Quiz ---------- */
function startQuiz(k,from){quiz={k,from,qs:DEFIS[k].gen(),i:0,res:[],answered:false,pick:[]};window.scrollTo({top:0,behavior:"smooth"});render()}
function renderQuiz(){
  const D=DEFIS[quiz.k], v=$("#view"), c=SUBJ[D.s].c;
  if(quiz.i>=quiz.qs.length){return renderResult()}
  const q=quiz.qs[quiz.i];
  let body="";
  if(q.type==="choice"){
    body=`<div class="qprompt">${esc(q.prompt)}${q.big?`<span class="big num">${esc(q.big)}</span>`:""}</div>
      <div class="opts" ${q.sym?'style="grid-template-columns:repeat(3,1fr)"':""}>${q.options.map((o,i)=>`<button class="opt ${q.sym?"sym":""}" data-o="${i}">${esc(o)}</button>`).join("")}</div>`;
  } else if(q.type==="order"){
    body=`<div class="qprompt">${esc(q.prompt)}</div><div class="slots" id="slots">${quiz.pick.length?quiz.pick.map((n,i)=>(i?`<span class="sep">${q.sep}</span>`:"")+`<span class="pill num">${fmt(n)}</span>`).join(""):'<span class="muted">Touche les nombres dans le bon ordre</span>'}</div>
      <div class="pool">${q.items.map((n,i)=>`<button class="pill num" data-n="${i}" ${quiz.pick.includes(n)?"disabled":""}>${fmt(n)}</button>`).join("")}</div>
      <div class="qactions"><button class="btn ghost" id="undo">Effacer</button><button class="btn" id="valid" ${quiz.pick.length<q.items.length?"disabled":""}>Valider</button></div>`;
  } else if(q.type==="div"){
    body=`<div class="qprompt">${esc(q.prompt)}</div>
      <div class="divbox num"><span class="dd">${fmt(q.a)}</span><span class="dv">${q.b}</span><span class="q muted">?</span></div>
      <p class="muted" style="margin-top:0">Pose-la sur une feuille, puis écris le résultat :</p>
      <form class="fields" id="divform"><label for="dq">Quotient<input id="dq" inputmode="numeric" autocomplete="off"></label><label for="dr">Reste<input id="dr" inputmode="numeric" autocomplete="off"></label><button class="btn" type="submit">Valider</button></form>`;
  }
  v.innerHTML=`<section class="quiz" style="--c:${c}">
    <div class="qtop"><h2 style="font-size:1.3rem">Défi ${D.n}</h2><button class="btn ghost" id="quit">Quitter</button></div>
    <div class="qbar">${quiz.qs.map((_,i)=>`<i class="${i<quiz.i?(quiz.res[i]?"ok":"ko"):i===quiz.i?"cur":""}"></i>`).join("")}</div>
    ${body}<div id="fb"></div></section>`;
  $("#quit").onclick=()=>{quiz=null;render()};
  if(q.type==="choice") v.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(q.options[+b.dataset.o]===q.answer,b));
  if(q.type==="order"){
    v.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{quiz.pick.push(q.items[+b.dataset.n]);renderQuiz()});
    $("#undo").onclick=()=>{quiz.pick=[];renderQuiz()};
    $("#valid").onclick=()=>answer(quiz.pick.every((n,i)=>n===q.correct[i]));
  }
  if(q.type==="div"){ $("#dq").focus({preventScroll:true});
    $("#divform").onsubmit=e=>{e.preventDefault();const qq=parseInt($("#dq").value.replace(/\s/g,""),10),rr=parseInt($("#dr").value.replace(/\s/g,""),10);
      answer(qq===Math.floor(q.a/q.b)&&rr===q.a%q.b)};
  }
}
function answer(ok,btn){
  if(quiz.answered)return; quiz.answered=true;
  const q=quiz.qs[quiz.i]; quiz.res[quiz.i]=ok;
  let right, prompt=q.prompt+(q.big?" "+q.big:"");
  if(q.type==="choice"){right=q.answer; document.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(q.options[+b.dataset.o]===q.answer)b.classList.add("good")}); if(!ok&&btn)btn.classList.add("wrong")}
  if(q.type==="order"){right=q.correct.map(fmt).join(` ${q.sep} `); document.querySelectorAll(".qactions button,.pool button").forEach(b=>b.disabled=true)}
  if(q.type==="div"){const qq=Math.floor(q.a/q.b),rr=q.a%q.b;right=`quotient ${qq}, reste ${rr}`; q.explain=`${fmt(q.a)} = ${q.b} × ${qq} + ${rr}, et ${rr} < ${q.b}.`; document.querySelectorAll("#divform input,#divform button").forEach(b=>b.disabled=true)}
  if(!ok){const st=state.quiz[quiz.k]=state.quiz[quiz.k]||{};st.missed=st.missed||{};const key=q.type==="choice"&&!q.sym&&q.key?q.key:q.key+"-"+prompt;const m=st.missed[key]||{n:0};st.missed[key]={n:m.n+1,prompt,answer:right}; const ks=Object.keys(st.missed); if(ks.length>25) delete st.missed[ks[0]]}
  $("#fb").innerHTML=`<div class="feedback ${ok?"ok":"ko"}">${ok?"Bravo !":"Pas tout à fait. Réponse : "+esc(right)+"."} ${q.explain?`<span style="font-weight:600">${esc(q.explain)}</span>`:""}</div>
    <div class="qactions"><button class="btn" id="next">${quiz.i+1<quiz.qs.length?"Question suivante":"Voir mon score"}</button></div>`;
  $("#next").onclick=()=>{quiz.i++;quiz.answered=false;quiz.pick=[];renderQuiz()};
  $("#next").focus({preventScroll:true});
}
function renderResult(){
  const D=DEFIS[quiz.k], total=quiz.qs.length, good=quiz.res.filter(Boolean).length;
  if(!quiz.saved){
    quiz.saved=true;
    const gain=good*2+(good===total?5:0);
    const st=state.quiz[quiz.k]=state.quiz[quiz.k]||{};
    st.runs=(st.runs||0)+1; st.total=total; st.best=Math.max(st.best||0,good); st.coins=(st.coins||0)+gain; st.last=Date.now();
    st.hist=[...(st.hist||[]),Math.round(good/total*100)].slice(-12);
    log(`Défi ${D.n} : ${good}/${total}`,gain);
    quiz.gain=gain;
    if(quiz.from&&good/total>=.75&&!state.done[quiz.from]){const t=allTasks.find(x=>x.id===quiz.from);state.done[quiz.from]=Date.now();quiz.gain+=t.p;quiz.auto=true}
    persist(); renderHeader();
  }
  const msg=good===total?"Sans-faute ! Tu es prêt.":good/total>=.75?"Très bien, encore un effort pour le sans-faute.":good/total>=.5?"C'est un bon début. Relis le mémo et rejoue.":"Relis le mémo, puis rejoue : ça va venir.";
  $("#view").innerHTML=`<section class="quiz" style="--c:${SUBJ[D.s].c}"><div class="result">
    <h2>Défi ${D.n}</h2><div class="score num">${good}/${total}</div><div class="stars" style="font-size:1.8rem">${stars(good,total)}</div>
    <p style="font-weight:700;margin:0">${msg}</p><p style="margin:0;color:var(--ocre);font-weight:800">+${quiz.gain} pièces${quiz.auto?" (mission cochée)":""}</p>
    <div class="qactions" style="justify-content:center"><button class="btn ghost" id="back">Retour</button><button class="btn" id="again">Rejouer</button></div></div></section>`;
  if(quiz.gain) toast(`+${quiz.gain} pièces !`);
  $("#back").onclick=()=>{quiz=null;render()}; $("#again").onclick=()=>startQuiz(quiz.k,quiz.from);
}
render();
</script>
